<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jira Ticket Ranker</title>
<style>
  /* Editorial layout on the Gusto Brand palette — Kale teal primary, ST terracotta accent (sparingly),
     Parsnip/Salt warm neutrals. ITC Clearface serif for display; G Centra for text. */
  :root {
    --type-family: "G Centra", "GCentra", -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", Helvetica, Arial, sans-serif;
    --display-family: "ITC Clearface Std", "Clearface", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --bg: #f8f5f2;        /* Parsnip — warm cream */
    --paper: #fbf9f6;
    --ink: #1c1c1c;
    --ink-soft: #3a3633;
    --muted: #6a6560;
    --faint: #948e87;
    --line: #e2dcd4;      /* warm hairline */
    --line-strong: #cfc7bc;
    --ready: #0a8080;     /* Kale-500 */
    --ready-deep: #005961;/* Kale-600 */
    --stretch: #a24942;   /* ST-400 brick */
    --held: #9b9894;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 var(--type-family);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: #cfeaec; }

  .page { max-width: 860px; margin: 0 auto; padding: 64px 40px 120px; }

  /* ---------- Masthead ---------- */
  .masthead { position: relative; }
  .kicker {
    font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--faint); font-weight: 600;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  }
  .kicker > span { white-space: nowrap; }
  .masthead .top-rule { height: 0; border-top: 3px double var(--ink); margin: 12px 0 22px; }
  h1.title {
    font-family: var(--display-family);
    font-size: clamp(34px, 6vw, 52px);
    line-height: 1.04;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    text-wrap: balance;
  }
  .dateline {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 4px 0;
    font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
  }
  .dateline .dl { display: inline-flex; align-items: baseline; }
  .dateline .dl + .dl::before {
    content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 0;
    background: var(--ready); margin: 0 13px; transform: translateY(-3px) rotate(45deg);
  }
  .dateline b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .standfirst {
    font-family: var(--type-family);
    font-size: 15.5px; line-height: 1.6; font-weight: 400; font-style: normal;
    color: var(--muted);
    margin: 26px 0 0;
    max-width: 64ch;
  }
  .standfirst b { font-weight: 600; color: var(--ink-soft); }

  .assigned {
    margin: 34px 0 0;
    padding: 20px 22px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .assigned .ctx { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .assigned .ctx b { color: var(--ink); font-weight: 600; }
  .assigned .ctx.head {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; margin: 12px 0 3px;
  }
  .assigned .ctx.head:first-child { margin-top: 0; }
  .assigned .ctx.item { padding-left: 16px; position: relative; color: var(--ink-soft); }
  .assigned .ctx.item::before {
    content: ""; position: absolute; left: 2px; top: .62em;
    width: 5px; height: 1px; background: var(--line-strong);
  }

  /* ---------- Section head ---------- */
  .tier-section { margin-top: 68px; }
  main > .tier-section:first-child { margin-top: 44px; }
  .section-head {
    display: flex; align-items: baseline; gap: 16px;
    padding-bottom: 12px; margin-bottom: 8px;
    border-bottom: 2px solid var(--ink);
  }
  .section-num {
    font-family: var(--display-family); font-size: 15px; font-weight: 600;
    color: var(--faint);
  }
  .section-label {
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 600; color: var(--ink); white-space: nowrap;
  }
  .section-count {
    margin-left: auto; font-size: 12px; color: var(--muted);
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  .tier-section.held .section-head { border-bottom-color: var(--line-strong); }
  .tier-section.held .section-label { color: var(--muted); }

  /* ---------- Entry ---------- */
  .entry {
    display: grid;
    grid-template-columns: 68px 1fr;
    gap: 0 28px;
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .entry.held { opacity: .82; }

  .rank {
    font-family: var(--display-family);
    font-size: 46px; line-height: .9; font-weight: 600;
    color: var(--ready); font-variant-numeric: lining-nums;
    padding-top: 2px;
  }
  .entry.stretch .rank { color: var(--stretch); }
  .entry.held .rank { font-size: 30px; color: var(--held); }

  .entry-kicker {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    font-size: 12px; letter-spacing: .04em;
    margin-bottom: 8px;
  }
  .entry-kicker .key {
    font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .02em; color: var(--ready-deep); text-decoration: none;
    border-bottom: 1px solid transparent; padding-bottom: 1px; white-space: nowrap;
  }
  .entry-kicker .key:hover { border-bottom-color: currentColor; }
  .entry.stretch .entry-kicker .key { color: var(--stretch); }
  .entry.held .entry-kicker .key { color: var(--muted); }
  .badge {
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    color: var(--muted);
  }
  .entry-kicker .k-sep { color: var(--line-strong); }
  .entry-kicker .k-prio {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    color: var(--muted);
  }
  .entry-kicker .k-prio.hi { color: var(--stretch); }

  .entry-title {
    font-family: var(--display-family);
    font-size: 25px; line-height: 1.18; font-weight: 600;
    letter-spacing: -0.005em;
    margin: 0; color: var(--ink);
    text-wrap: pretty;
  }
  .entry.held .entry-title { color: var(--ink-soft); }

  .loc { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); overflow-wrap: anywhere; margin: 8px 0 0; }
  .entry-dek { font-size: 16px; line-height: 1.55; color: var(--ink-soft); margin: 12px 0 0; max-width: 60ch; }
  .entry.held .entry-dek { color: var(--muted); }

  /* rationale as definition list */
  .rationale { margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
  .rat { display: grid; grid-template-columns: 130px 1fr; gap: 0 20px; align-items: baseline; }
  .rat dt {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; line-height: 1.7;
  }
  .rat dd { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-soft); }
  .rat dd b { color: var(--ink); font-weight: 600; }
  @media (max-width: 560px) { .rat { grid-template-columns: 1fr; gap: 2px; } }

  /* sync callout */
  .sync {
    margin: 20px 0 0;
    padding: 14px 16px 14px 18px;
    background: rgba(10, 128, 128, 0.05);
    border-left: 2px solid rgba(10, 128, 128, 0.45);
    border-radius: 0 4px 4px 0;
    font-size: 14px; line-height: 1.55; color: var(--ink-soft);
  }
  .sync .lbl {
    display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ready-deep); font-weight: 600; margin-bottom: 3px;
  }
  .sync .who { font-weight: 600; color: var(--ready-deep); }
  .entry.stretch .sync {
    background: rgba(162, 73, 66, 0.05);
    border-left-color: rgba(162, 73, 66, 0.45);
  }
  .entry.stretch .sync .lbl,
  .entry.stretch .sync .who { color: var(--stretch); }

  .note {
    margin: 16px 0 0; padding: 12px 16px; border-radius: 4px;
    background: var(--paper); border: 1px solid var(--line);
    color: var(--muted); font-size: 13px; line-height: 1.55;
  }
  .note b { color: var(--ink); font-weight: 600; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; padding: 0; list-style: none; }
  .pill {
    font-size: 11px; letter-spacing: .03em; color: var(--muted);
    padding: 2px 0; position: relative; white-space: nowrap;
  }
  .pill + .pill { padding-left: 15px; }
  .pill + .pill::before {
    content: ""; position: absolute; left: 5px; top: 50%;
    width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong);
    transform: translateY(-50%);
  }
  .pill.prio { color: var(--stretch); font-weight: 600; }
  .pill.prio.med { color: #8a5a40; }
  .pill.free { color: var(--ready-deep); font-weight: 600; }

  footer.foot {
    margin-top: 48px; padding-top: 22px; border-top: 3px double var(--ink);
    font-size: 12px; letter-spacing: .04em; color: var(--muted); line-height: 1.6;
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
  }
  footer.foot .fmark { font-family: var(--display-family); font-style: italic; font-size: 16px; letter-spacing: .02em; color: var(--ready); white-space: nowrap; }

  @media (max-width: 620px) {
    .page { padding: 44px 22px 90px; }
    .entry { grid-template-columns: 1fr; gap: 0; }
    .rank { font-size: 34px; margin-bottom: 6px; }
    .entry.held .rank { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="kicker"><span>Jira Ticket Ranker</span><span class="k-date" id="topdate"></span></div>
    <div class="top-rule"></div>
    <h1 class="title" id="title">—</h1>
    <div class="dateline" id="counts"></div>
    <p class="standfirst" id="banner"></p>
    <aside class="assigned" id="context"></aside>
  </header>
  <main id="tickets"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
// The skill replaces the whole block between the START/END markers (inclusive)
// with: const RANK = <JSON literal>;  (see SKILL.md Step 5 for the shape).
// meta supports: title, generated, jiraBase, counts {ready,stretch,held},
//   backlog (string — total open scanned, e.g. "127"), config, context[], banner.
// context[] convention: a line ending in ":" renders as a bold section header;
//   a line starting with "• " renders as an indented item. Lead with an
//   "Assigned to you:" header + "• KEY: summary — status" items (status-check, not pickups).
// tickets[]: key, tier (ready|stretch|held), badge, summary, headline,
//   rationale[] {lbl,val}, sync {who,why}, optional note, pills[].
/* __RANK_DATA_START__ */
const RANK = {
  meta: {
    title: "Sample — no data injected",
    generated: "—",
    jiraBase: "https://gustohq.atlassian.net/browse/",
    counts: { ready: 0, stretch: 0, held: 0 },
    backlog: "",
    config: "",
    context: [],
    banner: ""
  },
  tickets: []
};
/* __RANK_DATA_END__ */

const TIERS = [
  ["ready", "Ready"],
  ["stretch", "Stretch"],
  ["held", "Skip"],
];

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
}

function render() {
  const m = RANK.meta;
  document.title = "Jira Ticket Ranker — " + m.generated;
  document.getElementById("title").textContent = m.title;

  const c = m.counts || {};
  document.getElementById("topdate").textContent = m.generated;
  const parts = [];
  if (m.backlog) parts.push(`<span class="dl"><b>${m.backlog}</b>&nbsp;scanned</span>`);
  parts.push(`<span class="dl"><b>${c.ready||0}</b>&nbsp;ready</span>`);
  parts.push(`<span class="dl"><b>${c.stretch||0}</b>&nbsp;stretch</span>`);
  parts.push(`<span class="dl"><b>${c.held||0}</b>&nbsp;skip</span>`);
  document.getElementById("counts").innerHTML = parts.join("");

  const ctx = (m.config ? [m.config] : []).concat(m.context || []);
  const ctxEl = document.getElementById("context");
  if (!ctx.length) { ctxEl.style.display = "none"; }
  else {
    ctxEl.innerHTML = ctx.map(s => {
      let cls = "ctx";
      if (/^•\s/.test(s)) { cls += " item"; s = s.replace(/^•\s/, ""); }
      else if (/:$/.test(s)) cls += " head";
      const i = s.indexOf(": ");
      return (i > 0 && i <= 20)
        ? `<span class="${cls}"><b>${escapeHtml(s.slice(0, i))}</b> ${s.slice(i + 2)}</span>`
        : `<span class="${cls}">${s}</span>`;
    }).join("");
  }

  const bannerEl = document.getElementById("banner");
  if (m.banner) bannerEl.innerHTML = m.banner; else bannerEl.style.display = "none";

  const root = document.getElementById("tickets");
  let sectionNum = 0;
  let rank = 0;
  for (const [key, label] of TIERS) {
    const items = RANK.tickets.filter(t => t.tier === key);
    if (!items.length) continue;
    sectionNum++;
    const section = el("section", "tier-section " + key);
    const head = el("div", "section-head");
    head.innerHTML =
      `<span class="section-label">${escapeHtml(label)}</span>`;
    section.appendChild(head);
    for (const t of items) {
      const n = key === "held" ? null : ++rank;
      section.appendChild(card(t, n));
    }
    root.appendChild(section);
  }

  document.getElementById("foot").innerHTML =
    `<span class="fmark">Pick with gusto.</span>`;
}

function card(t, n) {
  const entry = el("article", "entry " + t.tier);

  const rankEl = el("div", "rank", n != null ? String(n) : "");
  entry.appendChild(rankEl);

  const body = el("div", "entry-body");

  const kicker = el("div", "entry-kicker");
  if (t.key) {
    const a = el("a", "key", t.key);
    a.href = (RANK.meta.jiraBase || "") + t.key;
    a.target = "_blank"; a.rel = "noopener";
    kicker.appendChild(a);
  }
  const prioRaw = (t.pills || []).find(p => /priority|highest|lowest|^\s*P[0-4]\b/i.test(p));
  if (prioRaw) {
    const level = prioRaw.replace(/\s*priority\s*/i, "").trim() || prioRaw;
    kicker.appendChild(el("span", "k-sep", "·"));
    const pr = el("span", "k-prio", level);
    if (/high|highest|P0|P1/i.test(prioRaw)) pr.classList.add("hi");
    kicker.appendChild(pr);
  }
  if (kicker.childNodes.length) body.appendChild(kicker);

  body.appendChild(el("h3", "entry-title", t.summary));

  if (t.loc) body.appendChild(el("div", "loc", t.loc));
  if (t.headline) body.appendChild(el("p", "entry-dek", t.headline));

  if (t.rationale && t.rationale.length) {
    const dl = el("dl", "rationale");
    for (const r of t.rationale) {
      const row = el("div", "rat");
      row.innerHTML = `<dt>${escapeHtml(r.lbl)}</dt><dd>${r.val}</dd>`;
      dl.appendChild(row);
    }
    body.appendChild(dl);
  }

  if (t.sync) {
    const s = el("div", "sync");
    s.innerHTML = `<span class="lbl">Sync first</span><span class="who">${escapeHtml(t.sync.who)}</span> — ${t.sync.why}`;
    body.appendChild(s);
  }

  if (t.note) {
    const nEl = el("div", "note");
    nEl.innerHTML = t.note;
    body.appendChild(nEl);
  }

  entry.appendChild(body);
  return entry;
}

render();
</script>
</body>
</html>
